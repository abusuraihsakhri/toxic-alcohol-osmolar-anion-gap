name: Test and security regression checks

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Python syntax and tests
        run: |
          python -m compileall -q agents toxic_alcohols.py cli.py tests
          python -m pytest -q
      - name: Browser calculator syntax and unit tests
        run: |
          node --check web/calculator.js
          node --test web/calculator.test.cjs
