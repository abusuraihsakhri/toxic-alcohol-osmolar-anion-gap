services:
  toxic-alcohol-osmolar-anion-gap:
    build: .
    container_name: toxic-alcohol-osmolar-anion-gap
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:?Set a strong AUDIT_SECRET_KEY in your environment}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-mock}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
